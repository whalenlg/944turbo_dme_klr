# Tests install/install_arch.sh on a clean archlinux:latest container:
# install, source setup, check_toolchain, then iverilog and Verilator smoke
# tests (install/test_arch_install.sh --in-container does the steps).
name: Arch install test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - install/**
      - setup
      - paths.sh
      - .github/workflows/arch-install.yml

jobs:
  arch:
    name: Arch Linux${{ matrix.venv && ' (--venv)' || '' }}
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        venv: [false, true]
    steps:
      - uses: actions/checkout@v5
      - name: Install and smoke test
        run: bash install/test_arch_install.sh --in-container ${{ matrix.venv && '--venv' || '' }}
      - name: Upload step logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: arch-install-logs${{ matrix.venv && '-venv' || '' }}
          path: /home/tester/tmp/arch-install-test/
          if-no-files-found: ignore
