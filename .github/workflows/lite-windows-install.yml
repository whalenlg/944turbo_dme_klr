# Runs install/install_lite_windows.ps1 on a Windows runner, in Windows
# PowerShell 5.1 (what a new PC has), against a published release: Node.js
# and Python are already on the runner, so winget isn't exercised; the
# download, unpack, venv and shortcut are. The script is run the way the
# manual's one-liner runs it, as a script block from its text.
name: Lite Windows installer

on:
  workflow_dispatch:
  pull_request:
    paths:
      - install/install_lite_windows.ps1
      - .github/workflows/lite-windows-install.yml

jobs:
  install:
    name: install_lite_windows.ps1
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install (no start)
        shell: powershell
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'lite'
          & ([scriptblock]::Create((Get-Content -Raw install\install_lite_windows.ps1))) -NoStart -Dir $dir
          $pkg = Get-ChildItem $dir -Directory -Filter 'dmeklr-lite-*-windows-x86_64' | Select-Object -First 1
          if (-not $pkg) { throw 'no package folder' }
          foreach ($f in 'run_lite.cmd', '.venv\Scripts\python.exe') {
            if (-not (Test-Path (Join-Path $pkg.FullName $f))) { throw "missing $f" }
          }
          & (Join-Path $pkg.FullName '.venv\Scripts\python.exe') -c "import pandas, openpyxl, matplotlib, numpy; print('venv ok')"
          if ($LASTEXITCODE -ne 0) { throw 'venv packages missing' }
      - name: Bridge answers
        shell: powershell
        run: |
          $pkg = (Get-ChildItem (Join-Path $env:RUNNER_TEMP 'lite') -Directory -Filter 'dmeklr-lite-*').FullName
          $p = Start-Process cmd -ArgumentList '/c', 'run_lite.cmd' -WorkingDirectory $pkg -PassThru -WindowStyle Hidden
          $ok = $false
          foreach ($i in 1..60) {
            try { $r = Invoke-WebRequest 'http://127.0.0.1:8951/?live' -UseBasicParsing -TimeoutSec 2; if ($r.StatusCode -eq 200) { $ok = $true; break } } catch { }
            Start-Sleep 1
          }
          taskkill /F /T /PID $p.Id | Out-Null
          if (-not $ok) { throw 'the bridge did not serve the dashboard' }
          'bridge serves the dashboard'
